transport_note: Any such server would need to carry the X-API-KEY scoped key described in authentication/findigs-authentication.yml,
  and would be handling FCRA-regulated consumer report data (credit, criminal and eviction ratings, income,
  mandatory disclosures) — see the data_sensitivity note in conventions/findigs-conventions.yml before
  exposing these tools to an agent.
