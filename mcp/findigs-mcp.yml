note: 'Findigs operates NO MCP server. Searched the npm registry, the published Findigs Client API reference
  and the company llms.txt; probed mcp.findigs.com, api.client.findigs.com/mcp, api.findigs.com/mcp and
  www.findigs.com/mcp with a JSON-RPC tools/list request on 2026-08-12 — nothing. mcp.findigs.com resolves
  and answers 200, but it is the same wildcard catch-all that serves status.findigs.com, trust.findigs.com
  and security.findigs.com: it 302s to https://app.findigs.com/login?redirectTo=%2Fdashboard and returns
  the login SPA, not an MCP endpoint. NO MCPServer pointer is emitted in apis.yml on the strength of this
  file, because that pointer asserts the provider runs a server and Findigs does not. The tools below
  are a CANDIDATE design derived one-to-one from the eight real operations in the published OpenAPI —
  a proposal for what a Findigs MCP server could expose, not a description of anything Findigs ships.'
