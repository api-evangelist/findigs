format: fastapi-validation-error
media_type: application/json
note: >-
  The Findigs Client API does NOT use RFC 9457 application/problem+json. Every operation in the spec
  declares exactly two responses — 200 and 422 — and the 422 body is the FastAPI/Pydantic
  HTTPValidationError envelope. The 400 and 403 entries below are documented behaviour observed
  outside the spec's responses map: the 403 was observed live on an unauthenticated request, and the
  400 is stated in the Get Applications description. The spec under-declares its error surface: no
  401, 403, 404, 429 or 5xx response is declared on any operation, so an agent reading only the
  contract cannot anticipate auth failure or a missing resource.
envelope:
  validation:
    field: detail
    shape: 'array of {loc: [string], msg: string, type: string}'
    schema: HTTPValidationError
  generic:
    field: detail
    shape: string or array of string
problems:
- status: 422
  name: HTTPValidationError
  title: Validation Error
  detail: >-
    Request failed Pydantic validation. detail[] carries one entry per invalid field with loc (the
    JSON path to the offending field), msg (human-readable message) and type (the validation rule
    that failed).
  media_type: application/json
  schema: '#/components/schemas/HTTPValidationError'
  remediation: >-
    Read detail[].loc to identify the offending parameter or body field and correct it. Common causes
    are a malformed uuid path parameter, size above the 100 maximum, page below 1, or a status value
    outside the declared enum.
