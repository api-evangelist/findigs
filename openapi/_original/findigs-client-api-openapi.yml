openapi: 3.1.0
info:
  title: Findigs Client API
  description: The findigs client api, dive into the endpoints using the menu on the left
  version: 0.1.0
servers:
- url: https://api.sandbox.findigs.com
  description: Sandbox Environment
- url: https://api.client.findigs.com
  description: Live Production Environment
paths:
  /listings/:
    get:
      tags:
      - Listings
      summary: Get Listings
      description: Fetch all listings
      operationId: get_listings_listings__get
      parameters:
      - required: false
        schema:
          type: string
          format: date-time
          title: Created At >=
        name: created_at__gte
        in: query
      - required: false
        schema:
          type: string
          format: date-time
          title: Created At <=
        name: created_at__lte
        in: query
      - required: false
        schema:
          type: string
          format: date-time
          title: Updated At >=
        name: updated_at__gte
        in: query
      - required: false
        schema:
          type: string
          format: date-time
          title: Updated At <=
        name: updated_at__lte
        in: query
      - required: false
        schema:
          type: integer
          minimum: 1.0
          title: Page
          default: 1
        name: page
        in: query
      - required: false
        schema:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Size
          default: 50
        name: size
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
    post:
      tags:
      - Listings
      summary: Post Listing
      description: 'Create a listing with all the information:


        - **url**: Each listing must have a url

        - **rent_amount**: The rent in dollars as a decimal

        - **date_available**: Date the listing is first available for move in.

        - **status**: A required status

        - **address**: The physical address of the listing


        **Sandbox**


        When a listing is POSTed to the sandbox, applications and groups will

        automatically be generated for it.'
      operationId: post_listing_listings__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /listings/{listing_id}:
    get:
      tags:
      - Listings
      summary: Get Listing
      description: Retrieve a specific listing by id (or external_id in the future?)
      operationId: get_listing_listings__listing_id__get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
        name: listing_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
    patch:
      tags:
      - Listings
      summary: Patch Listing
      description: 'PATCH update the listing specified.

        All fields in the body are optional, and only those provided will be set.'
      operationId: patch_listing_listings__listing_id__patch
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
        name: listing_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /applications/:
    get:
      tags:
      - Applications
      summary: Get Applications
      description: 'Get all applications matching the given query.

        Parts of the query are two optional CSV id sets, which are mutually exclusive

        You cannot query by both a group_id and a listing_id at once, to do so is a 400.'
      operationId: get_applications_applications__get
      parameters:
      - description: Comma separated list of group_ids to select Applications by
        required: false
        schema:
          items:
            type: string
            format: uuid
          type: array
          title: Groups
          description: Comma separated list of group_ids to select Applications by
        name: groups
        in: query
      - description: Comma separated list of listing_ids to select Applications by
        required: false
        schema:
          items:
            type: string
            format: uuid
          type: array
          title: Listings
          description: Comma separated list of listing_ids to select Applications by
        name: listings
        in: query
      - required: false
        schema:
          type: integer
          minimum: 1.0
          title: Page
          default: 1
        name: page
        in: query
      - required: false
        schema:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Size
          default: 50
        name: size
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /applications/{application_id}:
    get:
      tags:
      - Applications
      summary: Get Application
      description: Endpoint to retrieve an individual application by its id
      operationId: get_application_applications__application_id__get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
          title: Application Id
        name: application_id
        in: path
      - description: Retrieves BI data related to the application.
        required: false
        schema:
          type: boolean
          title: Embed Bi Data
          description: Retrieves BI data related to the application.
          default: false
        name: embed_bi_data
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /groups/:
    get:
      tags:
      - Groups
      summary: Get Groups
      operationId: get_groups_groups__get
      parameters:
      - description: Comma separated list of listing_ids to select Groups by
        required: false
        schema:
          items:
            type: string
            format: uuid
          type: array
          title: Listing Ids
          description: Comma separated list of listing_ids to select Groups by
        name: listing_ids
        in: query
      - description: Status for group of applications
        required: false
        schema:
          items:
            anyOf:
            - $ref: '#/components/schemas/GroupStatus'
            - type: string
          type: array
          title: Status
          description: Status for group of applications
        name: status
        in: query
      - required: false
        schema:
          type: string
          format: date-time
          title: Updated At >=
        name: updated_at__gte
        in: query
      - required: false
        schema:
          type: string
          format: date-time
          title: Updated At <=
        name: updated_at__lte
        in: query
      - required: false
        schema:
          type: integer
          minimum: 1.0
          title: Page
          default: 1
        name: page
        in: query
      - required: false
        schema:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Size
          default: 50
        name: size
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /groups/{group_id}:
    get:
      tags:
      - Groups
      summary: Get Group
      operationId: get_group_groups__group_id__get
      parameters:
      - description: Id of the group to retrieve
        required: true
        schema:
          type: string
          format: uuid
          title: Listing Id
          description: Id of the group to retrieve
        name: group_id
        in: path
      - description: Retrieves BI data related to the application.
        required: false
        schema:
          type: boolean
          title: Embed Bi Data
          description: Retrieves BI data related to the application.
          default: false
        name: embed_bi_data
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
components:
  schemas:
    AncillaryQuestion:
      properties:
        response:
          type: string
          title: Response
          description: The response of an ancillary question.
        questionText:
          type: string
          title: Questiontext
          description: The question of an ancillary question.
        questionType:
          allOf:
          - $ref: '#/components/schemas/AncillaryQuestionType'
          description: The type for an ancillary question.
      type: object
      required:
      - questionText
      - questionType
      title: AncillaryQuestion
      example:
        response: 'Yes'
        questionText: Test question text for ancillary question
        questionType: yes-no
    AncillaryQuestionType:
      type: string
      enum:
      - yes-no
      - file
      - text
      title: AncillaryQuestionType
      description: 'A type of ancillary question


        **YES_NO** - yes or no question type

        **FILE** - file upload question type

        **TEXT** - free text question type'
    Application:
      properties:
        listing_id:
          type: string
          format: uuid4
          title: Listing Id
          description: ID
        group_id:
          type: string
          format: uuid4
          title: Group Id
          description: ID of the group this application belongs to
        type:
          $ref: '#/components/schemas/ApplicationType'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        group_status:
          $ref: '#/components/schemas/GroupStatus'
        self_reported_data:
          $ref: '#/components/schemas/SelfReportedData'
        pet_data:
          items:
            $ref: '#/components/schemas/PetData'
          type: array
          title: Pet Data
        current_employment_data:
          $ref: '#/components/schemas/CurrentEmploymentData'
        credit_report_data:
          $ref: '#/components/schemas/CreditReportData'
        mandatory_disclosures:
          $ref: '#/components/schemas/MandatoryDisclosures'
        ancillary_questions:
          items:
            $ref: '#/components/schemas/AncillaryQuestion'
          type: array
          title: Ancillary Questions
        id:
          type: string
          format: uuid4
          title: Id
          description: Unique id of the application
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        bi_data:
          type: object
          title: Bi Data
          exclude_unset: true
      type: object
      required:
      - listing_id
      - group_id
      - type
      - status
      - group_status
      - pet_data
      - id
      - created_at
      - updated_at
      title: Application
      example:
        id: cb0a635b-c422-4a3f-8679-015a1466c748
        created_at: '2026-08-12T02:42:49.199599'
        updated_at: '2026-08-12T02:42:49.199603'
        listing_id: 6c27daea-cfb6-4117-b1c8-e98adab8ede5
        group_id: 9878a491-94b0-4049-93b9-5625c9c7ed0a
        type: applicant
        status: completed
        group_status: pending_review
        self_reported_data:
          first_name: Wernher
          last_name: Braun
          email: spaaaaace@nasa.gov
          phone: '+4903012345678'
        pet_data:
        - age: 5
          type: Dog
          breed: Pug
          weight: 15
          is_service_animal: false
        current_employment_data:
          type: employed
          income: 1234.56
          company: NASA
          position: Rocket Scientist
          start_date: '1960-04-01'
        credit_report_data:
          credit: '540'
          criminal: Pass
          eviction: Pass
          cautions: []
        mandatory_disclosures:
          qBankruptcy: false
          qBreakLease: false
          qDamage: false
          qEvict: false
          qFelony: false
          qForeclosure: false
          qNonPayment: false
          qOutstandingJudgements: true
          qRentersInsurance: false
          qSection8: false
          qSmoke: false
    ApplicationStatus:
      type: string
      enum:
      - in_progress
      - completed
      - accepted
      title: ApplicationStatus
      description: An enumeration.
    ApplicationType:
      type: string
      enum:
      - applicant
      - guarantor
      title: ApplicationType
      description: An enumeration.
    CreditReportData:
      properties:
        credit:
          type: string
          maxLength: 3
          minLength: 3
          pattern: ^[0-9]{3}$
          title: Credit
        criminal:
          type: string
          title: Criminal
          description: A rating of applicants criminal history
        eviction:
          type: string
          title: Eviction
          description: A rating of applicants eviction history
        cautions:
          items:
            type: string
          type: array
          title: Cautions
          description: Human readable caution statements from applicants credit check
      type: object
      title: CreditReportData
      example:
        credit: '540'
        criminal: Pass
        eviction: Pass
        cautions: []
    CurrentEmploymentData:
      properties:
        type:
          $ref: '#/components/schemas/EmploymentType'
        income:
          type: number
          title: Income
          description: Applicants gross monthly income, in dollars
        company:
          type: string
          title: Company
          description: Name of the company
        position:
          type: string
          title: Position
          description: Applicants position at the company
        start_date:
          type: string
          format: date
          title: Start Date
          description: When the applicant started working with this company
      type: object
      title: CurrentEmploymentData
      example:
        type: employed
        income: 1234.56
        company: NASA
        position: Rocket Scientist
        start_date: '1960-04-01'
    EmploymentType:
      type: string
      enum:
      - employed
      - offer
      - offer_letter
      - own
      - self_employed
      - student
      - not
      - other
      - benefits
      - retired
      title: EmploymentType
      description: 'A method of employment


        **EMPLOYED** - Is currently employed

        **OFFER** - Has an offer of employment

        **OFFER_LETTER** - Has an offer letter

        **OWN** - Owns their own business

        **SELF_EMPLOYED** - Self employed

        **STUDENT** - Student

        **NOT** - Not employed

        **OTHER** - Other employment type

        **BENEFITS** - Receiving benefits

        **RETIRED** - Retired'
    Group:
      properties:
        listing_id:
          type: string
          format: uuid4
          title: Listing Id
          description: ID of the listing the group applied to
        url:
          type: string
          maxLength: 65536
          minLength: 1
          format: uri
          title: Url
          description: URL of the full application on findigs.com
        status:
          allOf:
          - $ref: '#/components/schemas/GroupStatus'
          description: The status of the group
        workflow_status:
          type: string
          title: Workflow Status
          description: Custom group status displayed in the application list
        desired_move_in_date:
          type: string
          format: date
          title: Desired Move In Date
          description: when they wanna move
        decline_details:
          type: object
          title: Decline Details
          description: decline reasons yo
        applications:
          items:
            $ref: '#/components/schemas/Application'
          type: array
          title: Applications
        id:
          type: string
          format: uuid4
          title: Id
          description: Unique id of the group
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        bi_data:
          type: object
          title: Bi Data
          exclude_unset: true
      type: object
      required:
      - listing_id
      - url
      - status
      - workflow_status
      - applications
      - id
      - created_at
      - updated_at
      title: Group
      example:
        id: 0bdd37c8-4e8f-43b6-b899-5e8452019bfa
        created_at: '2026-08-12T02:42:49.201207'
        updated_at: '2026-08-12T02:42:49.201209'
        listing_id: 8a10744e-0a39-4715-82df-92bf55b6834e
        url: https://your-subdomain.findigs.com/group-applications/v2/groupid=7fe8e1a8-ad54-4855-86c8-3b2ac96fc1ca
        group_status: pending_review
        workflow_status: This is a string
        applications:
        - id: cb0a635b-c422-4a3f-8679-015a1466c748
          created_at: '2026-08-12T02:42:49.199599'
          updated_at: '2026-08-12T02:42:49.199603'
          listing_id: 6c27daea-cfb6-4117-b1c8-e98adab8ede5
          group_id: 9878a491-94b0-4049-93b9-5625c9c7ed0a
          type: applicant
          status: completed
          group_status: pending_review
          self_reported_data:
            first_name: Wernher
            last_name: Braun
            email: spaaaaace@nasa.gov
            phone: '+4903012345678'
          pet_data:
          - age: 5
            type: Dog
            breed: Pug
            weight: 15
            is_service_animal: false
          current_employment_data:
            type: employed
            income: 1234.56
            company: NASA
            position: Rocket Scientist
            start_date: '1960-04-01'
          credit_report_data:
            credit: '540'
            criminal: Pass
            eviction: Pass
            cautions: []
          mandatory_disclosures:
            qBankruptcy: false
            qBreakLease: false
            qDamage: false
            qEvict: false
            qFelony: false
            qForeclosure: false
            qNonPayment: false
            qOutstandingJudgements: true
            qRentersInsurance: false
            qSection8: false
            qSmoke: false
    GroupStatus:
      type: string
      enum:
      - incomplete
      - submitted
      - passed
      - pending_review
      - declined
      - approved
      - onboarded
      - cancelled
      title: GroupStatus
      description: Enum of GroupStatus
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Listing:
      properties:
        rent_amount:
          type: number
          minimum: 0.0
          title: Rent Amount
          description: Rent Amount in dollars (ex. 500.50)
        date_available:
          type: string
          format: date
          title: Date Available
          description: Date the listing is available for move-in
        status:
          $ref: '#/components/schemas/ListingStatus'
        address:
          $ref: '#/components/schemas/ListingAddressResult'
        url:
          type: string
          maxLength: 65536
          minLength: 1
          format: uri
          title: Listing URL
          description: Direct URL to the listing application portal
        id:
          type: string
          format: uuid
          title: Id
          description: Findigs internal id of the listing
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - status
      - address
      - url
      - id
      - created_at
      - updated_at
      title: Listing
      example:
        id: 98054c1b-79b1-4d87-a1ee-89e001bd86a7
        url: https://yoursubdomain.findigs.com/apply/unitid=98054c1b-79b1-4d87-a1ee-89e001bd86a7
        created_at: '2026-08-12T02:42:49.205840'
        updated_at: '2026-08-12T02:42:49.205842'
        rent_amount: '6969.69'
        date_available: '2021-04-20'
        status: LISTED
        address:
          address_line_1: 123 Fake St
          city: Melber
          state: KY
          postal_code: '42069'
    ListingAddress:
      properties:
        address_line_1:
          type: string
          title: Address Line 1
        address_line_2:
          type: string
          title: Address Line 2
        city:
          type: string
          title: City
        state:
          type: string
          maxLength: 2
          minLength: 2
          title: State
          description: 2 letter ISO 3166-2 US subdivision code (part after the "US-")
        postal_code:
          type: string
          maxLength: 10
          minLength: 5
          pattern: ^[0-9]{5}(?:-[0-9]{4})?$
          title: Postal Code
      type: object
      required:
      - address_line_1
      - city
      - state
      - postal_code
      title: ListingAddress
      example:
        address_line_1: 123 Fake St
        city: Melber
        state: KY
        postal_code: '42069'
      x-tags:
      - listings
    ListingAddressResult:
      properties:
        address_line_1:
          type: string
          title: Address Line 1
        address_line_2:
          type: string
          title: Address Line 2
        city:
          type: string
          title: City
        state:
          type: string
          title: State
        postal_code:
          type: string
          title: Postal Code
      type: object
      title: ListingAddressResult
      example:
        address_line_1: 123 Fake St
        city: Melber
        state: KY
        postal_code: '42069'
      x-tags:
      - listings
    ListingCreate:
      properties:
        rent_amount:
          type: number
          minimum: 0.0
          title: Rent Amount
          description: Rent Amount in dollars (ex. 500.50)
        date_available:
          type: string
          format: date
          title: Date Available
          description: Date the listing is available for move-in
        status:
          $ref: '#/components/schemas/ListingStatus'
        address:
          allOf:
          - $ref: '#/components/schemas/ListingAddress'
          title: Listing Address
          description: Physical address of the listing
      type: object
      required:
      - rent_amount
      - date_available
      - status
      - address
      title: ListingCreate
      example:
        rent_amount: '6969.69'
        date_available: '2021-04-20'
        status: LISTED
        address:
          address_line_1: 123 Fake St
          city: Melber
          state: KY
          postal_code: '42069'
      x-tags:
      - listings
    ListingStatus:
      type: string
      enum:
      - LISTED
      - LOCKED
      - CLOSED
      title: ListingStatus
      description: '* **LISTED**: Listing will appear in search and accept applications.

        * **LOCKED**: Listing will not appear in search but will accept applications

        * **CLOSED**: Listing will not appear in search or accept applications'
    ListingUpdate:
      properties:
        rent_amount:
          type: number
          minimum: 0.0
          title: Rent Amount
          description: Rent Amount in dollars (ex. 500.50)
        date_available:
          type: string
          format: date
          title: Date Available
          description: Date the listing is available for move-in
        status:
          $ref: '#/components/schemas/ListingStatus'
        address:
          allOf:
          - $ref: '#/components/schemas/ListingAddress'
          title: Listing Address
          description: Physical address of the listing
      type: object
      title: ListingUpdate
      example:
        rent_amount: '6969.69'
        date_available: '2021-04-20'
        status: LISTED
        address:
          address_line_1: 123 Fake St
          city: Melber
          state: KY
          postal_code: '42069'
      x-tags:
      - listings
    MandatoryDisclosures:
      properties:
        qBankruptcy:
          type: boolean
          title: Qbankruptcy
          description: Have you filed for bankruptcy in the last 7 years?
        qBreakLease:
          type: boolean
          title: Qbreaklease
          description: Have you ever broken a lease or rental agreement?
        qDamage:
          type: boolean
          title: Qdamage
