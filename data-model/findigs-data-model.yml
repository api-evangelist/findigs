notes:
- >-
  Application.group_status denormalizes Group.status onto the child, so the same fact appears in two
  places and a consumer reading an application list sees group state without a second call.
- >-
  bi_data on both Application and Group is declared as an untyped object gated behind the
  embed_bi_data query flag. Its contents are not described in the contract.
- >-
  Group.decline_details is an untyped object described only as "decline reasons yo" — a truncated
  description in the published spec. There is no enumerated decline-reason vocabulary, so the adverse
  action reasoning is not machine-readable.
- >-
  The write surface is Listing only. Applications and groups are read-only over the API; they are
  created by applicants through the Findigs renter experience, or auto-generated in the sandbox when a
  listing is POSTed.
