- {name: ListingAddress, used_by: [ListingCreate, ListingUpdate], note: 'request-side address; state is a 2-letter code, postal_code matches ^[0-9]{5}(?:-[0-9]{4})?$'}
- {name: ListingAddressResult, used_by: [Listing], note: 'response-side address; all constraints relaxed to plain strings'}
- {name: SelfReportedData, used_by: [Application], note: 'unverified applicant-entered first_name, last_name, email, phone (E.164 pattern)'}
- {name: CurrentEmploymentData, used_by: [Application], note: 'gross monthly income, company, position, start_date; type is EmploymentType'}
- {name: CreditReportData, used_by: [Application], note: 'credit is a 3-digit string (^[0-9]{3}$), plus criminal and eviction ratings and a cautions[] list of human-readable flags. Regulated consumer report data.'}
- {name: MandatoryDisclosures, used_by: [Application], note: '11 booleans — qBankruptcy, qBreakLease, qDamage, qEvict, qFelony, qForeclosure, qNonPayment, qOutstandingJudgements, qRentersInsurance, qSection8, qSmoke'}
- {name: PetData, used_by: [Application], note: 'repeated; type, breed, weight required, plus age and is_service_animal'}
