description: >-
  Entity-relationship graph derived from the components.schemas $ref links and the id-reference fields
  of the Findigs Client API OpenAPI 3.1.0 document. The model is a three-level funnel: a Listing is a
  unit accepting applications for a window of time; a Group is the set of people applying together for
  that listing and is the unit that gets DECIDED; an Application is one person's submission inside a
  group. Everything else hangs off Application as an embedded value object.
identifiers:
  format: uuid
  note: >-
    Path parameters are typed format uuid; Listing.id is format uuid while Application.id and
    Group.id are typed format uuid4. No prefixed or human-readable id scheme.
entities:
- name: Listing
  schema: Listing
  root: true
  description: >-
    The window of time during which a unit (a physical location) accepts rental applications. Findigs
    manages the underlying unit and property objects behind this resource; they are not exposed.
  operations: [get_listings_listings__get, post_listing_listings__post, get_listing_listings__listing_id__get, patch_listing_listings__listing_id__patch]
  writable: true
  create_schema: ListingCreate
  update_schema: ListingUpdate
  fields: [rent_amount, date_available, status, address, url, id, created_at, updated_at]
  enums: {status: ListingStatus}
- name: Group
  schema: Group
  description: >-
    A collection of applications and the attributes describing that collection. This is the decision
    unit — approval, decline and reversal happen at group level, and eight of the nine published
    webhook events are group events.
  operations: [get_groups_groups__get, get_group_groups__group_id__get]
  writable: false
  fields: [listing_id, url, status, workflow_status, desired_move_in_date, decline_details, applications, id, created_at, updated_at, bi_data]
  enums: {status: GroupStatus}
- name: Application
  schema: Application
  description: >-
    All data relevant to one applicant's effort to secure housing through a Findigs application,
    including consumer report data. Carries a denormalized copy of its group's status.
  operations: [get_applications_applications__get, get_application_applications__application_id__get]
  writable: false
  fields: [listing_id, group_id, type, status, group_status, self_reported_data, pet_data, current_employment_data, credit_report_data, mandatory_disclosures, ancillary_questions, id, created_at, updated_at, bi_data]
  enums: {type: ApplicationType, status: ApplicationStatus, group_status: GroupStatus}
