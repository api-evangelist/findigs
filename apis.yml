apis:
- name: Findigs Client API
  description: >-
    REST API for programmatic interaction with Findigs and integration of Findigs data into existing
    property management systems and workflows. Covers listings (the window during which a unit accepts
    rental applications), applications (an individual applicant's submission, including self-reported
    data, employment, credit report data, mandatory disclosures, pet data and ancillary questions) and
    groups (a collection of applications decisioned together). Authenticated with a scoped API key in
    the X-API-KEY header, with separate sandbox and production environments. Findigs states this API is
    not available to new clients; existing customers may continue and should contact
    integrations@findigs.com.
  humanURL: https://docs.getfindigs.com/
  baseURL: https://api.client.findigs.com
