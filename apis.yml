aid: findigs
name: Findigs
description: >-
  Findigs is a New York City based residential real estate decisioning platform that screens rental
  applicants for identity, income, employment, credit, criminal history, eviction records, documents
  and pets, then applies automated underwriting against each operator's own written policy criteria to
  render a full yes/no decision on every rental application rather than handing back raw screening
  reports. The platform spans screening, underwriting, policy optimization and post-lease performance
  data, is backed by a contractual fraud guarantee, and reports a median decision time of 3.4 hours
  across 400K+ rental units. Findigs publishes a machine-readable Client API — an OpenAPI 3.1.0
  contract served from api.client.findigs.com covering listings, applications and applicant groups,
  authenticated with a scoped X-API-KEY header and paired with a sandbox environment and a terse
  webhook event surface — though the company states the Client API is closed to new clients and
  existing integrators should contact integrations@findigs.com.
