note: >-
  Findigs publishes NO rate limits for the Client API. The published API reference at
  docs.getfindigs.com contains no rate-limit, throttling, quota or Retry-After language, and the live
  OpenAPI 3.1.0 document declares only 200 and 422 responses on every operation — no 429 anywhere.
  No X-RateLimit-*, RateLimit-* or Retry-After response header is documented. This is an honest zero,
  not an unchecked field: an integrating agent has no published runtime signal telling it when to back
  off, and must treat throttling behaviour as undiscoverable until it is observed in production.
  Limits could not be observed live either, because every endpoint requires a scoped API key that is
  issued only by Findigs staff (GET https://api.client.findigs.com/listings/ returns 403 Not
  authenticated unauthenticated), so no unauthenticated response carrying rate-limit headers exists.
pagination_bound:
  note: >-
    The only published request-volume constraint is the pagination ceiling, which is a page-size cap
    rather than a rate limit: size has maximum 100 and default 50 on all three collection operations.
